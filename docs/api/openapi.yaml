openapi: 3.0.3
info:
  title: Glide API
  version: 0.1.0
  description: |
    Backend API used by the Glide Android app and the internal admin panel.

    - Android uses the Kotlin DTOs in `shared/` directly; the admin panel generates TypeScript types from this file.
    - `backend/src/test/.../contract/OpenApiContractTest.kt` checks real responses against this file and fails on drift.
    - Every non-2xx response uses the `ErrorResponse` envelope. Clients branch on `error.code`, never on `message`.
    - Every response carries an `X-Request-Id` header. Quote it when reporting a problem.
servers:
  - url: http://localhost:8080
    description: Local development
tags:
  - name: health
    description: Liveness and readiness checks for hosting platforms, uptime monitors and the apps
  - name: me
    description: The signed-in person (any side of the app) and their onboarding choice

paths:
  /health/live:
    get:
      operationId: getLiveness
      tags: [health]
      summary: Liveness. The process is up (no dependencies checked)
      responses:
        "200":
          description: The backend process is running
          headers:
            X-Request-Id: { $ref: "#/components/headers/XRequestId" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HealthResponse" }
              example: { status: UP, version: 0.1.0 }
        default: { $ref: "#/components/responses/Error" }

  /health:
    get:
      operationId: getHealth
      tags: [health]
      summary: Readiness. The process is up and the database answers
      responses:
        "200":
          description: Backend and database are up
          headers:
            X-Request-Id: { $ref: "#/components/headers/XRequestId" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HealthResponse" }
              example: { status: UP, version: 0.1.0, database: UP }
        "503":
          description: The database is not answering; stop routing traffic here
          headers:
            X-Request-Id: { $ref: "#/components/headers/XRequestId" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HealthResponse" }
              example: { status: DOWN, version: 0.1.0, database: DOWN }
        default: { $ref: "#/components/responses/Error" }

  /v1/me:
    get:
      operationId: getMe
      tags: [me]
      summary: Who is signed in, and which side of the app to show them (D-024)
      description: Creates the person's record on their first request.
      security:
        - supabaseToken: []
      responses:
        "200":
          description: The signed-in person
          headers:
            X-Request-Id: { $ref: "#/components/headers/XRequestId" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MeResponse" }
              example: { id: 3f0c9a52-7d1e-4b8a-9a0e-2c1d5b6e7f80, phone: "919000000001" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        default: { $ref: "#/components/responses/Error" }

  /v1/me/side:
    put:
      operationId: updateMySide
      tags: [me]
      summary: Save the onboarding answer, customer or salon (can be switched later)
      security:
        - supabaseToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateSideRequest" }
            example: { side: CUSTOMER }
      responses:
        "200":
          description: Saved; returns the updated person
          headers:
            X-Request-Id: { $ref: "#/components/headers/XRequestId" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MeResponse" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        default: { $ref: "#/components/responses/Error" }

components:
  securitySchemes:
    supabaseToken:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Supabase Auth access token of the signed-in person (D-016). Checked against the project's public keys.

  headers:
    XRequestId:
      description: Request ID (echoed from the request if safe, otherwise generated)
      schema: { type: string, maxLength: 64 }

  responses:
    Unauthorized:
      description: Missing, expired or invalid login token. The app should send the person to sign in again
      headers:
        X-Request-Id: { $ref: "#/components/headers/XRequestId" }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
          example: { error: { code: UNAUTHORIZED, message: Please sign in again., requestId: 3f0c9a52-7d1e-4b8a-9a0e-2c1d5b6e7f80 } }
    Error:
      description: Any error. See `ErrorBody.code` for the reason
      headers:
        X-Request-Id: { $ref: "#/components/headers/XRequestId" }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
          example: { error: { code: NOT_FOUND, message: No such endpoint., requestId: 3f0c9a52-7d1e-4b8a-9a0e-2c1d5b6e7f80 } }

  schemas:
    HealthStatus:
      type: string
      enum: [UP, DOWN]

    HealthResponse:
      type: object
      additionalProperties: false
      required: [status, version]
      properties:
        status:
          $ref: "#/components/schemas/HealthStatus"
        version:
          type: string
          description: Backend build version
        database:
          $ref: "#/components/schemas/HealthStatus"

    UserSide:
      type: string
      enum: [CUSTOMER, SALON]
      description: Which interface the app shows (D-024)

    MeResponse:
      type: object
      additionalProperties: false
      required: [id]
      properties:
        id:
          type: string
          format: uuid
          description: Supabase user id
        phone:
          type: string
          description: Phone number used to sign in, as Supabase returns it (e.g. 919000000001)
        side:
          $ref: "#/components/schemas/UserSide"

    UpdateSideRequest:
      type: object
      additionalProperties: false
      required: [side]
      properties:
        side:
          $ref: "#/components/schemas/UserSide"

    ErrorResponse:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error: { $ref: "#/components/schemas/ErrorBody" }

    ErrorBody:
      type: object
      additionalProperties: false
      required: [code, message]
      properties:
        code:
          type: string
          description: |
            Stable machine-readable code. Shared codes: BAD_REQUEST, UNAUTHORIZED, FORBIDDEN, NOT_FOUND,
            METHOD_NOT_ALLOWED, PAYLOAD_TOO_LARGE, UNSUPPORTED_MEDIA_TYPE, RATE_LIMITED, INTERNAL.
            Features add their own.
        message:
          type: string
          description: Human-readable; may change; never contains stack traces or secrets
        requestId:
          type: string
          description: Same as the X-Request-Id response header

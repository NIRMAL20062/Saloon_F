        - DELHI
        - JAMMU_AND_KASHMIR
        - LADAKH
        - LAKSHADWEEP
        - PUDUCHERRY

    MeResponse:
      type: object
      additionalProperties: false
      required: [id]
      properties:
        id:
          type: string
          format: uuid
          description: Supabase user id
        phone:
          type: string
          description: Phone number used to sign in, as Supabase returns it (e.g. 919000000001)
        side:
          $ref: "#/components/schemas/UserSide"
        name:
          type: string
          minLength: 2
          maxLength: 60
          description: The person's name; missing until given at onboarding
        email:
          type: string
          maxLength: 254
          description: Optional email, in lower case

    UpdateProfileRequest:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name:
          type: string
          description: 2–60 characters after trimming
        email:
          type: string
          nullable: true
          description: Optional; empty or missing clears it

    UpdateSideRequest:
      type: object
      additionalProperties: false
      required: [side]
      properties:
        side:
          $ref: "#/components/schemas/UserSide"

    AdminStatus:
      type: string
      enum: [INVITED, ACTIVE]
      description: INVITED until the admin's first login with the authenticator app, then ACTIVE

    AdminResponse:
      type: object
      additionalProperties: false
      required: [id, email, status]
      properties:
        id:
          type: string
          format: uuid
          description: Supabase user id of the admin's login
        email:
          type: string
          maxLength: 254
          description: Login email, in lower case
        status:
          $ref: "#/components/schemas/AdminStatus"

    InviteAdminRequest:
      type: object
      additionalProperties: false
      required: [email]
      properties:
        email:
          type: string
          description: Trimmed and lower-cased; at most 254 characters and shaped like an email address

    ErrorResponse:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error: { $ref: "#/components/schemas/ErrorBody" }

    ErrorBody:
      type: object
      additionalProperties: false
      required: [code, message]
      properties:
        code:
          type: string
          description: |
            Stable machine-readable code. Shared codes: BAD_REQUEST, UNAUTHORIZED, FORBIDDEN, NOT_FOUND,
            METHOD_NOT_ALLOWED, PAYLOAD_TOO_LARGE, UNSUPPORTED_MEDIA_TYPE, RATE_LIMITED, INTERNAL.
            Features add their own.
        message:
          type: string
          description: Human-readable; may change; never contains stack traces or secrets
        requestId:
          type: string
          description: Same as the X-Request-Id response header

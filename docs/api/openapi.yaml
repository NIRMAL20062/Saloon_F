openapi: 3.0.3
info:
  title: Glide API
  version: 0.1.0
  description: |
    Backend API used by the Glide Android app and the internal admin panel.

    - Android uses the Kotlin DTOs in `shared/` directly; the admin panel generates TypeScript types from this file.
    - `backend/src/test/.../contract/OpenApiContractTest.kt` checks real responses against this file and fails on drift.
    - Every non-2xx response uses the `ErrorResponse` envelope. Clients branch on `error.code`, never on `message`.
    - Every response carries an `X-Request-Id` header. Quote it when reporting a problem.
servers:
  - url: http://localhost:8080
    description: Local development
tags:
  - name: health
    description: Liveness and readiness checks for hosting platforms, uptime monitors and the apps
  - name: me
    description: The signed-in person (any side of the app) and their onboarding choice
  - name: admin
    description: |
      Our team's admin website (D-013). Every /v1/admin endpoint needs a login that is in our admins table (matched on the
      Supabase user id) and has passed the authenticator-app step (token claim aal = aal2, DF-16). Otherwise 403 with
      NOT_ADMIN or MFA_REQUIRED.
  - name: salon
    description: The salon side (D-017). The salon is always the signed-in person's one salon (D-036); no route takes a salon id

paths:
  /health/live:
    get:
      operationId: getLiveness
      tags: [health]
      summary: Liveness. The process is up (no dependencies checked)
      responses:
        "200":
          description: The backend process is running
          headers:
            X-Request-Id: { $ref: "#/components/headers/XRequestId" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HealthResponse" }
              example: { status: UP, version: 0.1.0 }
        default: { $ref: "#/components/responses/Error" }

  /health:
    get:
      operationId: getHealth
      tags: [health]
      summary: Readiness. The process is up and the database answers
      responses:
        "200":
          description: Backend and database are up
          headers:
            X-Request-Id: { $ref: "#/components/headers/XRequestId" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HealthResponse" }
              example: { status: UP, version: 0.1.0, database: UP }
        "503":
          description: The database is not answering; stop routing traffic here
          headers:
            X-Request-Id: { $ref: "#/components/headers/XRequestId" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HealthResponse" }
              example: { status: DOWN, version: 0.1.0, database: DOWN }
        default: { $ref: "#/components/responses/Error" }

  /v1/me:
    get:
      operationId: getMe
      tags: [me]
      summary: Who is signed in, and which side of the app to show them (D-024)
      description: Creates the person's record on their first request.
      security:
        - supabaseToken: []
      responses:
        "200":
          description: The signed-in person
          headers:
            X-Request-Id: { $ref: "#/components/headers/XRequestId" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MeResponse" }
              example: { id: 3f0c9a52-7d1e-4b8a-9a0e-2c1d5b6e7f80, phone: "919000000001" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        default: { $ref: "#/components/responses/Error" }

  /v1/me/side:
    put:
      operationId: updateMySide
      tags: [me]
      summary: Save the onboarding answer, customer or salon. Final once chosen (D-030); the same answer again is accepted
      security:
        - supabaseToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateSideRequest" }
            example: { side: CUSTOMER }
      responses:
        "200":
          description: Saved; returns the updated person
          headers:
            X-Request-Id: { $ref: "#/components/headers/XRequestId" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MeResponse" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "409":
          description: A different side was already chosen; it can't be changed (error code SIDE_ALREADY_CHOSEN)
          headers:
            X-Request-Id: { $ref: "#/components/headers/XRequestId" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        default: { $ref: "#/components/responses/Error" }

  /v1/me/profile:
    put:
      operationId: updateMyProfile
      tags: [me]
      summary: Save the signed-in person's own name and optional email (BE-018, DF-18)
      description: |
        The name is trimmed and must be 2–60 characters. The email is optional: empty or missing clears it; otherwise it is
        trimmed, stored in lower case, at most 254 characters and must look like an email address.
      security:
        - supabaseToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateProfileRequest" }
            example: { name: Priya Sharma, email: priya@example.com }
      responses:
        "200":
          description: Saved; returns the updated person
          headers:
            X-Request-Id: { $ref: "#/components/headers/XRequestId" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MeResponse" }
        "400":
          description: Malformed body, or a field fails validation (error codes INVALID_NAME, INVALID_EMAIL)
          headers:
            X-Request-Id: { $ref: "#/components/headers/XRequestId" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        default: { $ref: "#/components/responses/Error" }

  /v1/admin/me:
    get:
      operationId: getAdminMe
      tags: [admin]
      summary: The signed-in admin. An INVITED admin becomes ACTIVE on their first request with MFA done (BE-020)
      security:
        - supabaseToken: []
      responses:
        "200":
          description: The signed-in admin
          headers:
            X-Request-Id: { $ref: "#/components/headers/XRequestId" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminResponse" }
              example: { id: 3f0c9a52-7d1e-4b8a-9a0e-2c1d5b6e7f80, email: admin@glide.test, status: ACTIVE }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/AdminForbidden" }
        default: { $ref: "#/components/responses/Error" }

  /v1/admin/admins/invites:
    post:
      operationId: inviteAdmin
      tags: [admin]
      summary: Invite another admin by email (BE-020, D-013). Audit-logged
      description: |
        The email is trimmed and lower-cased. Supabase creates the login and sends its invite email; if the email already
        has a Supabase login, none is sent and that login is used. The new admin is INVITED until their first login with
        the authenticator app.
      security:
        - supabaseToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/InviteAdminRequest" }
            example: { email: new.admin@example.com }
      responses:
        "201":
          description: Invited; returns the pending admin
          headers:
            X-Request-Id: { $ref: "#/components/headers/XRequestId" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminResponse" }
              example: { id: 3f0c9a52-7d1e-4b8a-9a0e-2c1d5b6e7f80, email: new.admin@example.com, status: INVITED }
        "400":
          description: Malformed body, or the email fails validation (error code INVALID_EMAIL)
          headers:
            X-Request-Id: { $ref: "#/components/headers/XRequestId" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/AdminForbidden" }
        "409":
          description: This email is already an admin (error code ADMIN_ALREADY_EXISTS)
          headers:
            X-Request-Id: { $ref: "#/components/headers/XRequestId" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "502":
          description: Supabase refused or failed to send the invite; nothing was saved (error code INVITE_FAILED)
          headers:
            X-Request-Id: { $ref: "#/components/headers/XRequestId" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "503":
          description: The server has no Supabase secret key, so it can't invite (error code INVITES_UNAVAILABLE)
          headers:
            X-Request-Id: { $ref: "#/components/headers/XRequestId" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        default: { $ref: "#/components/responses/Error" }

  /v1/salon/salons:
    post:
      operationId: createSalon
      tags: [salon]
      summary: Create the signed-in person's salon; they become its owner (BE-017, D-033, D-035)
      description: |
        Only for a person who chose the salon side (D-030) and belongs to no salon yet. The salon starts as DRAFT.
        Text fields are trimmed. The phone defaults to the owner's login number (D-046).
      security:
        - supabaseToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SalonProfileRequest" }
            example: { name: Glow Studio, address: { line1: "12, MG Road", area: Indiranagar, landmark: Near the metro, city: Bengaluru, state: KARNATAKA, pincode: "560038" }, type: UNISEX }
      responses:
        "201":
          description: Created; returns the salon (DRAFT) and the role OWNER
          headers:
            X-Request-Id: { $ref: "#/components/headers/XRequestId" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MySalonResponse" }
        "400":
          description: Malformed body, or a field fails validation (error codes INVALID_SALON_NAME, INVALID_SALON_PHONE, INVALID_ADDRESS)
          headers:
            X-Request-Id: { $ref: "#/components/headers/XRequestId" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403":
          description: The person hasn't chosen the salon side (error code NOT_SALON_SIDE)
          headers:
            X-Request-Id: { $ref: "#/components/headers/XRequestId" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "409":
          description: The person already belongs to a salon (error code ALREADY_IN_SALON)
          headers:
            X-Request-Id: { $ref: "#/components/headers/XRequestId" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        default: { $ref: "#/components/responses/Error" }

  /v1/salon/me:
    get:
      operationId: getMySalon
      tags: [salon]
      summary: The signed-in person's one salon and their role in it (BE-017, D-036)
      security:
        - supabaseToken: []
      responses:
        "200":
          description: The salon and the person's role
          headers:
            X-Request-Id: { $ref: "#/components/headers/XRequestId" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MySalonResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404":
          description: The person belongs to no salon yet (error code NO_SALON)
          headers:
            X-Request-Id: { $ref: "#/components/headers/XRequestId" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        default: { $ref: "#/components/responses/Error" }

  /v1/salon/salon:
    put:
      operationId: updateMySalon
      tags: [salon]
      summary: The owner edits the salon's profile while it isn't live (BE-017, D-039)
      description: |
        Same body and rules as creating it. Allowed while DRAFT, UNDER_VERIFICATION or REJECTED.
      security:
        - supabaseToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SalonProfileRequest" }
            example: { name: Glow Studio, address: { line1: "12, MG Road", area: Indiranagar, landmark: Near the metro, city: Bengaluru, state: KARNATAKA, pincode: "560038" }, type: UNISEX }
      responses:
        "200":
          description: Saved; returns the salon and the role OWNER
          headers:
            X-Request-Id: { $ref: "#/components/headers/XRequestId" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MySalonResponse" }
        "400":
          description: Malformed body, or a field fails validation (error codes INVALID_SALON_NAME, INVALID_SALON_PHONE, INVALID_ADDRESS)
          headers:
            X-Request-Id: { $ref: "#/components/headers/XRequestId" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403":
          description: The person is staff, not the owner (error code NOT_OWNER)
          headers:
            X-Request-Id: { $ref: "#/components/headers/XRequestId" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "404":
          description: The person belongs to no salon yet (error code NO_SALON)
          headers:
            X-Request-Id: { $ref: "#/components/headers/XRequestId" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "409":
          description: The salon is LIVE or SUSPENDED (error code SALON_NOT_EDITABLE)
          headers:
            X-Request-Id: { $ref: "#/components/headers/XRequestId" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        default: { $ref: "#/components/responses/Error" }

  /v1/salon/bank-details:
    put:
      operationId: saveMyBankDetails
      tags: [salon]
      summary: The owner saves or replaces the salon's bank details while it isn't live (BE-032, DF-24, DF-33)
      description: |
        The account number is stored only encrypted (AES-256-GCM, key from the server's environment) and is never sent
        back: responses carry its last 4 digits. Never logged.
      security:
        - supabaseToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BankDetailsRequest" }
            example: { accountHolderName: Asha Rao, accountNumber: "50100123456789", ifsc: HDFC0001234 }
      responses:
        "200":
          description: Saved; returns the details masked
          headers:
            X-Request-Id: { $ref: "#/components/headers/XRequestId" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BankDetailsResponse" }
        "400":
          description: Malformed body, or a field fails validation (error codes INVALID_ACCOUNT_HOLDER, INVALID_ACCOUNT_NUMBER, INVALID_IFSC)
          headers:
            X-Request-Id: { $ref: "#/components/headers/XRequestId" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403":
          description: The person is staff, not the owner (error code NOT_OWNER)
          headers:
            X-Request-Id: { $ref: "#/components/headers/XRequestId" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "404":
          description: The person belongs to no salon yet (error code NO_SALON)
          headers:
            X-Request-Id: { $ref: "#/components/headers/XRequestId" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "409":
          description: The salon is LIVE or SUSPENDED (error code SALON_NOT_EDITABLE)
          headers:
            X-Request-Id: { $ref: "#/components/headers/XRequestId" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "503":
          description: The server has no encryption key for bank details (error code BANK_DETAILS_UNAVAILABLE)
          headers:
            X-Request-Id: { $ref: "#/components/headers/XRequestId" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        default: { $ref: "#/components/responses/Error" }
    get:
      operationId: getMyBankDetails
      tags: [salon]
      summary: The owner reads the salon's bank details, masked (BE-032, DF-24)
      security:
        - supabaseToken: []
      responses:
        "200":
          description: The bank details, masked
          headers:
            X-Request-Id: { $ref: "#/components/headers/XRequestId" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BankDetailsResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403":
          description: The person is staff, not the owner (error code NOT_OWNER)
          headers:
            X-Request-Id: { $ref: "#/components/headers/XRequestId" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "404":
          description: No salon (error code NO_SALON) or no bank details saved yet (error code NO_BANK_DETAILS)
          headers:
            X-Request-Id: { $ref: "#/components/headers/XRequestId" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        default: { $ref: "#/components/responses/Error" }

  /v1/salon/submit-for-verification:
    post:
      operationId: submitMySalon
      tags: [salon]
      summary: The owner sends the salon to our team for verification (BE-032, D-033)
      description: |
        DRAFT or REJECTED with bank details saved → UNDER_VERIFICATION (an old rejection reason is cleared). Already under
        verification → the same answer, so retrying is safe.
      security:
        - supabaseToken: []
      responses:
        "200":
          description: Submitted (or already under verification); returns the salon
          headers:
            X-Request-Id: { $ref: "#/components/headers/XRequestId" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MySalonResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403":
          description: The person is staff, not the owner (error code NOT_OWNER)
          headers:
            X-Request-Id: { $ref: "#/components/headers/XRequestId" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "404":
          description: The person belongs to no salon yet (error code NO_SALON)
          headers:
            X-Request-Id: { $ref: "#/components/headers/XRequestId" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "409":
          description: No bank details yet (error code NO_BANK_DETAILS), or the salon is LIVE or SUSPENDED (error code SALON_NOT_EDITABLE)
          headers:
            X-Request-Id: { $ref: "#/components/headers/XRequestId" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        default: { $ref: "#/components/responses/Error" }

components:
  securitySchemes:
    supabaseToken:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Supabase Auth access token of the signed-in person (D-016). Checked against the project's public keys.

  headers:
    XRequestId:
      description: Request ID (echoed from the request if safe, otherwise generated)
      schema: { type: string, maxLength: 64 }

  responses:
    Unauthorized:
      description: Missing, expired or invalid login token. The app should send the person to sign in again
      headers:
        X-Request-Id: { $ref: "#/components/headers/XRequestId" }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
          example: { error: { code: UNAUTHORIZED, message: Please sign in again., requestId: 3f0c9a52-7d1e-4b8a-9a0e-2c1d5b6e7f80 } }
    AdminForbidden:
      description: |
        Signed in, but not allowed: NOT_ADMIN (this login is not one of our admins) or MFA_REQUIRED (an admin whose login
        hasn't passed the authenticator-app step)
      headers:
        X-Request-Id: { $ref: "#/components/headers/XRequestId" }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
          example: { error: { code: MFA_REQUIRED, message: Log in with the code from your authenticator app to continue., requestId: 3f0c9a52-7d1e-4b8a-9a0e-2c1d5b6e7f80 } }
    Error:
      description: Any error. See `ErrorBody.code` for the reason
      headers:
        X-Request-Id: { $ref: "#/components/headers/XRequestId" }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
          example: { error: { code: NOT_FOUND, message: No such endpoint., requestId: 3f0c9a52-7d1e-4b8a-9a0e-2c1d5b6e7f80 } }

  schemas:
    HealthStatus:
      type: string
      enum: [UP, DOWN]

    HealthResponse:
      type: object
      additionalProperties: false
      required: [status, version]
      properties:
        status:
          $ref: "#/components/schemas/HealthStatus"
        version:
          type: string
          description: Backend build version
        database:
          $ref: "#/components/schemas/HealthStatus"

    UserSide:
      type: string
      enum: [CUSTOMER, SALON]
      description: Which interface the app shows (D-024)

    SalonProfileRequest:
      type: object
      additionalProperties: false
      required: [name, address, type]
      properties:
        name:
          type: string
          maxLength: 30
          description: 1–30 characters after trimming (D-046)
        phone:
          type: string
          description: |
            The number customers call: an Indian number of 10 digits, with or without +91, 91 or a leading 0; spaces and
            dashes are fine. Missing or empty: the owner's login number (D-046, DF-32)
        address: { $ref: "#/components/schemas/SalonAddress" }
        type: { $ref: "#/components/schemas/SalonType" }

    SalonAddress:
      type: object
      additionalProperties: false
      required: [line1, area, city, state, pincode]
      properties:
        line1: { type: string, maxLength: 100, description: "House, shop or building, and street" }
        area: { type: string, maxLength: 100, description: Area or locality }
        landmark: { type: string, maxLength: 100, description: Optional }
        city: { type: string, maxLength: 50 }
        state: { $ref: "#/components/schemas/IndianState" }
        pincode: { type: string, pattern: "^[1-9][0-9]{5}$" }

    SalonResponse:
      type: object
      additionalProperties: false
      required: [id, name, phone, address, type, status]
      properties:
        id: { type: string, format: uuid }
        name: { type: string, maxLength: 30 }
        phone: { type: string, pattern: "^91[2-9][0-9]{9}$", description: "E.164 without +, e.g. 919876543210" }
        address: { $ref: "#/components/schemas/SalonAddress" }
        type: { $ref: "#/components/schemas/SalonType" }
        status: { $ref: "#/components/schemas/SalonStatus" }
        rejectionReason: { type: string, description: Why our team rejected it; only when REJECTED }

    MySalonResponse:
      type: object
      additionalProperties: false
      required: [salon, role]
      properties:
        salon: { $ref: "#/components/schemas/SalonResponse" }
        role: { $ref: "#/components/schemas/SalonRole" }

    BankDetailsRequest:
      type: object
      additionalProperties: false
      required: [accountHolderName, accountNumber, ifsc]
      properties:
        accountHolderName: { type: string, maxLength: 100, description: 1–100 characters after trimming }
        accountNumber: { type: string, description: "9–18 digits; spaces are dropped" }
        ifsc: { type: string, description: "11 characters: 4 letters, 0, 6 letters or digits; small letters are fine" }

    BankDetailsResponse:
      type: object
      additionalProperties: false
      required: [accountHolderName, accountNumberLast4, ifsc]
      properties:
        accountHolderName: { type: string, maxLength: 100 }
        accountNumberLast4: { type: string, pattern: "^[0-9]{4}$", description: The last 4 digits only; never the full number (DF-24) }
        ifsc: { type: string, pattern: "^[A-Z]{4}0[A-Z0-9]{6}$" }

    SalonType:
      type: string
      enum: [MEN, WOMEN, UNISEX]

    SalonStatus:
      type: string
      enum: [DRAFT, UNDER_VERIFICATION, LIVE, REJECTED, SUSPENDED]
      description: Onboarding state (D-033); only LIVE salons add staff, show up for customers and take bookings

    SalonRole:
      type: string
      enum: [OWNER, STAFF]
      description: The person's role in their one salon (D-039)

    IndianState:
      type: string
      description: India's 28 states and 8 union territories (DF-32)
      enum:
        - ANDHRA_PRADESH
        - ARUNACHAL_PRADESH
        - ASSAM
        - BIHAR
        - CHHATTISGARH
        - GOA
        - GUJARAT
        - HARYANA
        - HIMACHAL_PRADESH
        - JHARKHAND
        - KARNATAKA
        - KERALA
        - MADHYA_PRADESH
        - MAHARASHTRA
        - MANIPUR
        - MEGHALAYA
        - MIZORAM
        - NAGALAND
        - ODISHA
        - PUNJAB
        - RAJASTHAN
        - SIKKIM
        - TAMIL_NADU
        - TELANGANA
        - TRIPURA
        - UTTAR_PRADESH
        - UTTARAKHAND
        - WEST_BENGAL
        - ANDAMAN_AND_NICOBAR_ISLANDS
        - CHANDIGARH

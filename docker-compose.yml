# Local development only. Passwords here are throwaway local values, never reused anywhere else.
# Start the database:   docker compose up -d postgres   (older installs: docker-compose up -d postgres)
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: glide
      POSTGRES_USER: glide
      POSTGRES_PASSWORD: glide_local_only
    ports:
      # Bound to localhost only, so the database is not reachable from the network.
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U glide -d glide"]
      interval: 2s
      timeout: 3s
      retries: 30

  # Full stack (backend in Docker too), used by the end-to-end tests:
  #   docker compose --profile full up -d --build
  backend:
    profiles: ["full"]
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      APP_ENV: local
      PORT: "8080"
      DATABASE_URL: jdbc:postgresql://postgres:5432/glide
      DATABASE_USER: glide
      DATABASE_PASSWORD: glide_local_only
      CORS_ALLOWED_ORIGINS: http://localhost:3000
      SUPABASE_URL: https://uwvaebgbdqitbnymoqfq.supabase.co
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata: {}

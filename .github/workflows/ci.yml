# CI: proves every push to main and every pull request builds and passes all tests.
# Jobs run only for the parts a change touches; `ci-ok` is the single check to require in branch protection.
# Third-party actions are pinned to full commit SHAs (tag in the comment) so a moved tag can't change what runs.
# Runner image pinned to ubuntu-24.04: `ubuntu-latest` moves to Ubuntu 26 from 2026-10-19; upgrade deliberately.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  JAVA_VERSION: "21"
  NODE_VERSION: "24"

jobs:
  changes:
    name: Detect changed areas
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: read
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      android: ${{ steps.filter.outputs.android }}
      admin: ${{ steps.filter.outputs.admin }}
    steps:
      # Keeps the (read-only) token so paths-filter can `git fetch` the previous commit to diff against.
      # Without it the fetch fails on private repos and every job is skipped.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          filters: |
            build: &build
              - 'gradle/**'
              - 'gradlew'
              - '*.gradle.kts'
              - 'gradle.properties'
              - '.github/workflows/ci.yml'
            backend:
              - *build
              - 'shared/**'
              - 'backend/**'
              - 'docs/api/openapi.yaml'
              - 'docker-compose.yml'
            android:
              - *build
              - 'shared/**'
              - 'android/**'
            admin:
              - '.github/workflows/ci.yml'
              - 'admin/**'
              - 'docs/api/openapi.yaml'

  backend:
    name: Backend + shared (ktlint, tests on real Postgres)
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      # Skip configuring the Android app here; the android job covers it.
      GLIDE_BACKEND_ONLY: "true"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
      # Also validates the Gradle wrapper jar against Gradle's published checksums.
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
      - name: ktlint + tests (Testcontainers uses the runner's Docker)
        run: ./gradlew spotlessCheck :shared:check :backend:check
      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: backend-test-reports
          path: |
            shared/build/reports/tests
            backend/build/reports/tests
          retention-days: 7

  android:
    name: Android (ktlint, lint, unit + UI tests, builds)
    needs: changes
    if: needs.changes.outputs.android == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
      - name: ktlint, Android lint, unit + Robolectric UI tests, debug + release builds
        run: >-
          ./gradlew
          :android:app:spotlessCheck
          :android:app:lintDebug
          :android:app:testDebugUnitTest
          :android:app:assembleDebug
          :android:app:assembleRelease
      - name: Upload debug APK
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: glide-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          retention-days: 7
      - name: Upload reports
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: android-reports
          path: |
            android/app/build/reports
          retention-days: 7

  admin:
    name: Admin panel (lint, typecheck, tests, build)
    needs: changes
    if: needs.changes.outputs.admin == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: admin
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: admin/package.json
          cache: true
          cache_dependency_path: admin/pnpm-lock.yaml
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false
      - run: pnpm install --frozen-lockfile
      - run: pnpm verify

  e2e:
    name: End-to-end smoke (Docker backend + Postgres + admin)
    needs: changes
    if: needs.changes.outputs.backend == 'true' || needs.changes.outputs.admin == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Start backend + fresh Postgres in Docker (runs all migrations on an empty database)
        run: docker compose --profile full up -d --build --wait --wait-timeout 300
      - name: Backend reports database UP
        run: |
          curl -fsS http://localhost:8080/health | tee health.json
          grep -q '"database":"UP"' health.json
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: admin/package.json
          cache: true
          cache_dependency_path: admin/pnpm-lock.yaml
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false
      - name: Admin panel starts against the real backend; pages need a login
        working-directory: admin
        env:
          API_BASE_URL: http://localhost:8080
          # Public values of the team's development project. No login happens in this smoke test.
          SUPABASE_URL: https://uwvaebgbdqitbnymoqfq.supabase.co
          SUPABASE_PUBLISHABLE_KEY: sb_publishable_4SjiEzyCa5wA7sQQETlNtA_Gq0gQ7R_
        run: |
          export ADMIN_SESSION_SECRET="$(openssl rand -base64 32)"
          pnpm install --frozen-lockfile
          pnpm build
          (pnpm start > ../admin.log 2>&1 &)
          for i in $(seq 1 60); do curl -fsS http://localhost:3000/login -o page.html && break; sleep 1; done
          grep -q "Glide Admin" page.html
          # Logged out, the home page redirects to the login page (WEB-005).
          test "$(curl -s -o /dev/null -w '%{http_code} %{redirect_url}' http://localhost:3000/)" = "307 http://localhost:3000/login"
      - name: Container and admin logs
        if: failure()
        run: |
          docker compose --profile full logs
          cat admin.log || true
      - name: Stop containers
        if: always()
        run: docker compose --profile full down -v

  ci-ok:
    name: ci-ok
    if: always()
    needs: [changes, backend, android, admin, e2e]
    runs-on: ubuntu-24.04
    steps:
      - name: All required jobs passed or were skipped
        run: |
          echo '${{ toJSON(needs) }}'
          if [ "${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}" = "true" ]; then
            echo "A required job failed or was cancelled."
            exit 1
          fi
